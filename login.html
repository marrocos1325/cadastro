<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>  
        <h1>cadastre-se img</h1>
     </header>
    <main>
        <Form class="paulo">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required placeholder="exeplo@gamil.com">
         <br>
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" required placeholder="senha">
        <br>
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" required placeholder="Nome">
        <br>
        <label for="end">Endereço</label>
        <input type="text" name="end" id="end" required placeholder="Endereço">
        <br>
        <label for="cpf">CPF</label>
        <input type="text"name="cpf" id="cpf" required placeholder="000.000.000.00" max="14">
        <br>
        <label for="img">Foto de perfil</label>
        <input type="file" name="img" id="img" required>
        <br>
        <button id="ttk" type="submit">Cadastrar!</button>
        </Form>
    </main>
    <footer>
        <h3> &copy Todos os direitos reservados</h3>
    </footer>
    <script src="script.js"></script>
</body>
</html>
